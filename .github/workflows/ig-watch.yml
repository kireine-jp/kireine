name: コメント通知
on:
  schedule:
    - cron: "17 * * * *"   # 毎時
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  watch:
    if: vars.COMMENT_WATCH != 'off'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Load Threads token
        env:
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
          TH_APP_SECRET: ${{ secrets.TH_APP_SECRET }}
        run: bash tools/ig/th_env.sh
      - name: Check new comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ig/comments.py
