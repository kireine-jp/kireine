name: コメント通知
on:
  schedule:
    - cron: "17 * * * *"   # 毎時
  workflow_dispatch:
permissions:
  issues: write
  contents: write
jobs:
  watch:
    if: vars.COMMENT_WATCH != 'off'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Load Threads token
        env:
          TH_TOKEN: ${{ secrets.TH_TOKEN }}
          TH_APP_SECRET: ${{ secrets.TH_APP_SECRET }}
        run: bash tools/ig/th_env.sh
      - name: Check new comments
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/ig/comments.py
      - name: Detect manually posted reels
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python3 tools/ig/detect_manual.py
          git config user.name "kireine-bot"; git config user.email "info@kirei-ne.com"
          git add ig/*/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -qm "ig: manual reel posted" && git pull -q --rebase && git push -q)
