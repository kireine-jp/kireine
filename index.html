<script>/* Read-only data layer for the public site: serves /data/<collection>.json through the same calls the app uses. */
(function(){
  var cache={};
  function load(name){
    if(!/^(clinics|prices|updates|reviews)$/.test(name))return Promise.resolve([]);
    if(!cache[name])cache[name]=fetch("/data/"+name+".json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():[]}).catch(function(){return []});
    return cache[name];
  }
  function snap(rows){return{docs:rows.map(function(r){var id=r.id;return{id:id,data:function(){var o={};for(var k in r)if(k!=="id")o[k]=r[k];return o}}})}}
  function coll(name){
    var q={
      orderBy:function(){return q},limit:function(){return q},where:function(){return q},
      get:function(){return load(name).then(snap)},
      onSnapshot:function(ok,err){load(name).then(function(rows){ok(snap(rows))},function(e){if(err)err(e)});return function(){}},
      add:function(){return Promise.reject({code:"read_only"})}
    };
    return q;
  }
  var db={collection:coll,doc:function(){return{set:function(){return Promise.reject({code:"read_only"})},update:function(){return Promise.reject({code:"read_only"})},delete:function(){return Promise.reject({code:"read_only"})}}}};
  window.claude={use:function(n){return Promise.resolve(n==="db"?db:null)}};
})();

/* Layout: phone app shell — sticky top bar, stacked views (home / guide / compare / clinic / likes / info), fixed bottom tab bar, clinic page has its own fixed CTA bar. Cerise accent on porcelain; Manrope numerals for prices. */
:root{
  --bg:#FFFDFC; --surface:#ffffff; --sunk:#F6EEEC; --line:#EFE5E2; --line2:#E0D2CE;
  --fg:#3B2A2C; --muted:#7E6E70; --faint:#A8999A;
  --accent:#9A554D; --accent-2:#B0675F; --accent-soft:#F6EEEC; --accent-fg:#ffffff;
  --good:#4F7A62; --good-soft:#E8F0EA; --warn:#8A5A1E; --warn-soft:#F7EEDF; --star:#C99A4E;
  --shadow:0 0 0 1px var(--line);
  --blush:#F6EEEC; --t-botox:#F2E4E1; --t-hair:#ECE6F0; --t-spot:#F4EADF; --t-filler:#E5ECEE; --t-booster:#E7EDE6;
  --sans:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --num:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --serif:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:18px; --tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1516; --surface:#231C1D; --sunk:#2C2324; --line:#3A2F30; --line2:#4A3D3E;
  --fg:#F3E9E7; --muted:#BBAAA8; --faint:#8C7C7B;
  --accent:#E3A59C; --accent-2:#D08D84; --accent-soft:#3A2A2A; --accent-fg:#2A1A1A;
  --good:#8FC2A2; --good-soft:#1F2D25; --warn:#E3B66E; --warn-soft:#33281A; --star:#E3B66E;
  --shadow:0 0 0 1px var(--line);
  --blush:#2C2324; --t-botox:#3A2B2A; --t-hair:#302B38; --t-spot:#3A3026; --t-filler:#26313A; --t-booster:#28322A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1516; --surface:#231C1D; --sunk:#2C2324; --line:#3A2F30; --line2:#4A3D3E;
  --fg:#F3E9E7; --muted:#BBAAA8; --faint:#8C7C7B;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dots i{width:6px;height:6px;border-radius:3px;background:var(--line2)}
.dots i.on{width:16px;background:var(--fg)}

.igrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}

/* 検索: 全角半角・ひらがな/カタカナを同一視、地名の読み(ぎんざ→銀座)、スペース区切りAND */
const kata=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
const YOMI={"ギンザ":"銀座","シンジュク":"新宿","シブヤ":"渋谷","イケブクロ":"池袋","エビス":"恵比寿","オモテサンドウ":"表参道","アオヤマ":"青山","ロッポンギ":"六本木","アカサカ":"赤坂","アザブ":"麻布","ウエノ":"上野","キンシチョウ":"錦糸町","ゴタンダ":"五反田","シナガワ":"品川","メグロ":"目黒","ハラジュク":"原宿","キチジョウジ":"吉祥寺","タチカワ":"立川","マチダ":"町田","ジユウガオカ":"自由が丘","フタコタマガワ":"二子玉川","サンゲンジャヤ":"三軒茶屋","キタセンジュ":"北千住","アサクサ":"浅草","ヒロオ":"広尾","ナカノ":"中野","オオミヤ":"大宮","ヨコハマ":"横浜","ウメダ":"梅田","シンサイバシ":"心斎橋","ナンバ":"難波","テンジン":"天神","ハカタ":"博多","サカエ":"栄","ナゴヤ":"名古屋","サッポロ":"札幌","センダイ":"仙台","ヒロシマ":"広島","サンノミヤ":"三宮","コウベ":"神戸","キョウト":"京都","トウキョウ":"東京","オオサカ":"大阪","フクオカ":"福岡","アイチ":"愛知","カナガワ":"神奈川","ホッカイドウ":"北海道","ミヤギ":"宮城","ヒョウゴ":"兵庫","サイタマ":"埼玉","チバ":"千葉","ミナト":"港区","チュウオウ":"中央区","セタガヤ":"世田谷","ネリマ":"練馬","スミダ":"墨田","アダチ":"足立","ムサシノ":"武蔵野",
 "ボトックス":"ボトックス","ヒアル":"ヒアルロン酸","ダツモウ":"脱毛","シミ":"シミ"};
const ALIAS={"エラ":"botox","小顔":"botox","シワ":"botox","脱毛":"hair","ワキ":"hair","vio":"hair","全身":"hair","フォト":"spot","シミ":"spot","ipl":"spot","肌育":"booster","サーモン":"booster","涙袋":"filler","ほうれい":"filler","ヒアル":"filler"};
function expand(t){const k=kata(t);if(YOMI[k])return [k,kata(YOMI[k])];const hit=Object.keys(YOMI).find(y=>y.length>=3&&y.startsWith(k)&&k.length>=2);return hit?[k,kata(YOMI[hit])]:[k]}
function vSearch(){
  const raw=S.q.trim();
  let h='<label class="sbar">'+IC.search+'<input id="q" type="search" placeholder="施術名・クリニック名・エリアで探す" value="'+esc(S.q)+'" aria-label="検索" autocomplete="off" enterkeyhint="search"></label>';
  if(!raw)return h+'<section><div class="sh"><h3>人気のキーワード</h3></div><div class="kw">'+KW.map(k=>'<button data-kw="'+esc(k)+'">'+esc(k)+'</button>').join("")+'</div></section>';
  const toks=raw.split(/[\s　]+/).filter(Boolean).map(expand);           // 各トークンは候補の配列(どれか一致でOK)
  const hit=(f,alts)=>alts.some(a=>kata(f).includes(a));
  const gHit=(g,alts)=>alts.some(a=>[g.name,g.short,...g.subs.map(x=>x[1])].some(f=>kata(f).includes(a))||Object.entries(ALIAS).some(([k,v])=>v===g.id&&a.includes(kata(k))));
  const tg=toks.map(alts=>GROUPS.filter(g=>gHit(g,alts)));                  // トークンごとの施術一致
  const gs=[...new Set(tg.flat())];
  const cf=c=>[c.name,c.area,c.pref,c.address,c.station];
  const restToks=toks.filter((_,i)=>!tg[i].length);                         // 施術以外のトークン(エリア・院名)
  const catsOf=new Set(gs.flatMap(g=>g.subs.map(x=>x[0])));
  let cids=Object.keys(S.clinics).filter(id=>{const c=S.clinics[id];return restToks.length?restToks.every(alts=>cf(c).some(f=>hit(f,alts))):false});
  if(gs.length&&restToks.length)cids=cids.filter(id=>S.prices.some(p=>p.clinicId===id&&catsOf.has(p.cat)));
  let ps=S.prices.filter(p=>{const c=S.clinics[p.clinicId];if(!c)return false;
    const okT=gs.length?catsOf.has(p.cat):toks.some(alts=>hit(p.product,alts));
    const okR=restToks.length?restToks.every(alts=>cf(c).some(f=>hit(f,alts))||hit(p.product,alts)):true;
    return okT&&okR&&(gs.length||restToks.length)});
  ps=ps.sort((a,b)=>a.price-b.price).slice(0,30);
  if(gs.length)h+='<section><div class="sh"><h3>施術</h3></div><div class="kw">'+gs.map(g=>'<button data-guide="'+g.id+'">'+esc(g.name)+' ›</button>').join("")+'</div></section>';
  if(cids.length)h+='<section><div class="sh"><h3>クリニック</h3></div><div class="clist">'+cids.map(clinicCard).join("")+'</div></section>';
  if(ps.length&&(restToks.length||!gs.length))h+='<section><div class="sh"><h3>料金</h3></div><div class="plist">'+ps.map(p=>priceCard(p,null,false)).join("")+'</div></section>';
  if(!gs.length&&!cids.length&&!ps.length)h+='<div class="empty">'+(PUBLIC?'<img class="nkimg" src="/mascot.jpg" alt="" width="64" height="64">':IC.empty)+'<span>「'+esc(raw)+'」に一致する結果がありません<br><small>例: 銀座 ボトックス / しぶや / ヒアル'+(PUBLIC?'<br>載せてほしいクリニックは<a href="/contact.html" style="color:var(--accent)">こちら</a>から教えてね':'')+'</small></span></div>';
  return h;
}

  h+='<div class="note">予約リクエストは本アプリの運営者が受け付け、クリニックへ取り次ぎます。予約が確定するまで、クリニックの予約枠は確保されていません。</div>';

}

function vMyBook(){return S.bookings.length?'<div class="plist">'+S.bookings.map(bookingCard).join("")+'</div>':'<div class="empty">'+IC.cal+'<span>まだ予約リクエストはありません。</span></div>'}
function vMyRev(){const rs=S.reviews.filter(r=>S.uid&&r.author===S.uid).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));return rs.length?'<div class="card">'+rs.map(reviewHTML).join("")+'</div>':'<div class="empty">'+IC.empty+'<span>まだ口コミを投稿していません。</span></div>'}
function vBook(v){

  if(!S.canWrite)return '<div class="empty">'+IC.user+'<span>このページへの参加権限がないため、予約リクエストを送れません。</span></div>';
  if(v.done)return '<div class="empty" style="gap:12px">'+IC.cal+'<b style="color:var(--fg);font-size:17px">予約リクエストを送信しました</b><span>運営者がクリニックに空き状況を確認し、ご入力の連絡先にご連絡します。状況はマイページで確認できます。</span><button class="btn primary" data-tab="my">マイページを見る</button></div>';
  const ORD=GROUPS.flatMap(g=>g.subs.map(s=>s[0]));const ps=S.prices.filter(p=>p.clinicId===v.id).sort((a,b)=>(ORD.indexOf(a.cat)-ORD.indexOf(b.cat))||a.price-b.price);
  const t=new Date();t.setDate(t.getDate()+1);const min=t.toISOString().slice(0,10);
  const times=["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00"];
  const tsel=id=>'<select id="'+id+'"><option value="">時間を選ぶ</option>'+times.map(x=>'<option>'+x+'</option>').join("")+'<option>指定なし</option></select>';
  let h='<section class="chead"><span class="tg acc">'+esc(locLabel(c))+'</span><h1>'+esc(c.name)+'</h1><span class="small muted">メニューと希望日時を選んで送信してください。費用はかかりません。</span></section>';
  h+='<form id="bk-form" novalidate><div class="field"><span class="lbl">メニュー</span><div class="opts">'+ps.map((p,i)=>'<label class="opt"><input type="radio" name="bk-menu" value="'+esc(p.id)+'"'+(i===0?' checked':'')+'><span class="t">'+esc(CAT2G[p.cat].short)+' · '+esc(p.cat==="rejuran"&&p.cc?p.cc+"cc":SUBNAME(p.cat))+'<small>'+esc(p.product)+(COND[p.cond]?' · '+COND[p.cond]:'')+'</small></span><span class="p">'+yen(p.price)+'円</span></label>').join("")+'<label class="opt"><input type="radio" name="bk-menu" value="consult"><span class="t">カウンセリングのみ<small>メニューは相談して決めたい</small></span><span class="p">—</span></label></div></div>';
  h+='<div class="card" style="display:grid;gap:12px"><div class="row2"><div class="field"><label for="bk-d1">第1希望日</label><input id="bk-d1" type="date" min="'+min+'"></div><div class="field"><label for="bk-t1">時間</label>'+tsel("bk-t1")+'</div></div><div class="row2"><div class="field"><label for="bk-d2">第2希望日(任意)</label><input id="bk-d2" type="date" min="'+min+'"></div><div class="field"><label for="bk-t2">時間</label>'+tsel("bk-t2")+'</div></div></div>';
  h+='<div class="card" style="display:grid;gap:12px"><div class="field"><label for="bk-name">お名前(カナ)</label><input id="bk-name" maxlength="40" autocomplete="name" placeholder="例:ヤマダ ハナコ"></div><div class="field"><label for="bk-tel">電話番号</label><input id="bk-tel" type="tel" maxlength="20" autocomplete="tel" inputmode="tel" placeholder="例:090-1234-5678"></div><div class="field"><label for="bk-note">ご要望(任意)</label><textarea id="bk-note" maxlength="500" placeholder="気になる部位、初めてかどうか、麻酔の希望など"></textarea></div></div>';
  h+='<label class="chk"><input type="checkbox" id="bk-agree"><span>入力した情報を、予約の取り次ぎのためにこのクリニックへ提供することに同意します。表示料金は公式サイトの掲載額で、最終的な金額・適応は医師の診察で決まります。</span></label>';
  h+='<div style="display:grid;gap:8px"><span class="msg" id="bk-msg" role="alert"></span><button class="btn primary" type="submit" style="width:100%;padding:15px">予約リクエストを送信</button></div></form>';
  return h;
}
async function submitBooking(e){
  e.preventDefault();const m=$("#bk-msg");const v=view();const sel=document.querySelector('input[name="bk-menu"]:checked');
  const d1=$("#bk-d1").value,t1=$("#bk-t1").value,name=$("#bk-name").value.trim(),tel=$("#bk-tel").value.trim();
  const err=t=>{m.className="msg err";m.textContent=t};
  if(!sel)return err("メニューを選んでください");
  if(!d1||!t1)return err("第1希望の日付と時間を選んでください");
  if(name.length<2)return err("お名前を入力してください");
  if(!/^[0-9+\-() ]{10,20}$/.test(tel))return err("電話番号を正しく入力してください(例:090-1234-5678)");
  if(!$("#bk-agree").checked)return err("情報提供への同意にチェックしてください");
  const p=S.prices.find(x=>x.id===sel.value),c=S.clinics[v.id];
  const d={clinicId:v.id,clinicName:c.name,priceId:p?p.id:"",menu:p?CAT2G[p.cat].name+" "+(p.cat==="rejuran"&&p.cc?p.cc+"cc":SUBNAME(p.cat))+" / "+p.product:"カウンセリングのみ",price:p?p.price:0,
    date1:d1,time1:t1,date2:$("#bk-d2").value,time2:$("#bk-t2").value,name,tel,note:$("#bk-note").value.trim(),status:"requested",reply:"",createdAt:Date.now()};
  const btn=e.target.querySelector("[type=submit]");btn.disabled=true;m.className="msg";m.textContent="送信中…";
  try{
    await S.db.doc("bookings/"+S.uid).set({uid:S.uid,updatedAt:Date.now()});
    await S.db.collection("bookings/"+S.uid+"/items").add(d);
    v.done=true;toast("予約リクエストを送信しました");render(true);
  }catch(er){btn.disabled=false;err(er?.code==="invalid_argument"?"このページへの送信権限がありません":"送信できませんでした。時間をおいてもう一度お試しください")}
}
async function loadAdmin(){
  if(!S.db||!S.me.edit)return;S.adminList=null;render();
  try{const us=await S.db.collection("bookings").get();const all=[];
    for(const u of us.docs){const it=await S.db.collection("bookings/"+u.id+"/items").get();it.docs.forEach(d=>all.push({id:d.id,uid:u.id,...d.data()}))}
    S.adminList=all.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  }catch(e){S.adminList=[];toast("読み込めませんでした")}
  render();
}
async function setStatus(key,st){const[uid,id]=key.split("/");try{await S.db.doc("bookings/"+uid+"/items/"+id).update({status:st});const b=S.adminList.find(x=>x.uid===uid&&x.id===id);if(b)b.status=st;toast("「"+STATUS[st]+"」に変更しました");render()}catch(e){toast("変更できませんでした")}}
function vAdmin(){
  if(!S.me.edit)return '<div class="empty">'+IC.user+'<span>運営者のみ表示できます。</span></div>';

  h+=list.length?'<div class="plist">'+list.map(b=>'<div class="bk"><div class="row"><span class="cn">'+esc(b.clinicName)+'</span><span class="st '+esc(b.status)+'">'+STATUS[b.status]+'</span></div><div class="small">'+esc(b.menu)+(b.price?' · '+yen(b.price)+'円':'')+'</div><div class="small"><b>'+esc(b.name)+'</b> · <span style="user-select:all">'+esc(b.tel)+'</span></div><div class="xs muted">第1希望 '+esc(b.date1)+' '+esc(b.time1)+(b.date2?' / 第2希望 '+esc(b.date2)+' '+esc(b.time2):'')+'</div>'+(b.note?'<div class="xs">'+esc(b.note)+'</div>':'')+'<div class="adm">'+F.filter(f=>f!==b.status).map(f=>'<button data-setst="'+esc(b.uid+"/"+b.id)+'" data-st="'+f+'">'+STATUS[f]+'へ</button>').join("")+'</div></div>').join("")+'</div>':'<div class="empty">'+IC.cal+'<span>「'+STATUS[S.adminFilter]+'」の予約リクエストはありません。</span></div>';
  h+='<div class="note">予約リクエストの個人情報は運営者だけが見られます。クリニックへの取り次ぎ以外の目的で使わないでください。</div>';
  return h;
}

function bind(){
  const root=document;
  root.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>tabGo(b.dataset.tab));
  root.querySelectorAll("[data-pop]").forEach(b=>b.onclick=pop);
  root.querySelectorAll("[data-search]").forEach(b=>b.onclick=()=>{S.q="";push({name:"search"});setTimeout(()=>$("#q")?.focus(),30)});
  root.querySelectorAll("[data-guide]").forEach(b=>{const f=e=>{if(e.type==="keydown"&&e.key!=="Enter")return;push({name:"guide",id:b.dataset.guide})};b.onclick=f;b.onkeydown=f});
  root.querySelectorAll("[data-cmp]").forEach(b=>b.onclick=()=>{const[g,c]=b.dataset.cmp.split("|");S.cmp.group=g;S.cmp.cat=c;S.cmp.origin="";tabGo("compare")});
  root.querySelectorAll("[data-clinic]").forEach(b=>b.onclick=e=>{if(e.target.closest("[data-like]"))return;S.ctab="price";addRecent(b.dataset.clinic);push({name:"clinic",id:b.dataset.clinic})});
  root.querySelectorAll("[data-htab]").forEach(b=>b.onclick=()=>{S.htab=b.dataset.htab;render();const t=document.querySelector(".htabs");if(t&&t.getBoundingClientRect().top<0)t.scrollIntoView({block:"start"})});
  root.querySelectorAll("[data-like]").forEach(b=>b.onclick=e=>{e.stopPropagation();toggleLike(b.dataset.like)});
  root.querySelectorAll("[data-group]").forEach(b=>b.onclick=()=>{const g=GROUPS.find(x=>x.id===b.dataset.group);S.cmp.group=g.id;S.cmp.cat=g.subs[0][0];S.cmp.origin="";S.cmp.sort="price";render()});
  root.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{S.cmp.cat=b.dataset.cat;S.cmp.origin="";S.cmp.sort="price";render()});
  root.querySelectorAll("[data-gcat]").forEach(b=>b.onclick=()=>{view().cat=b.dataset.gcat;render()});
  root.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{S.ctab=b.dataset.ctab;render()});
  root.querySelectorAll("[data-kw]").forEach(b=>b.onclick=()=>{S.q=b.dataset.kw;render()});
  const fp=$("#f-pref");if(fp)fp.onchange=()=>{S.cmp.pref=fp.value;if(!fp.value)S.cmp.localOnly=false;try{localStorage.setItem("bhp-pref",fp.value)}catch(e){}render();toast(fp.value?fp.value+"で絞り込みました":"全国を表示しています")};
  const fo=$("#f-origin");if(fo)fo.onchange=()=>{S.cmp.origin=fo.value;render()};
  const fpr=$("#f-promo");if(fpr)fpr.onclick=()=>{S.cmp.promo=!S.cmp.promo;render()};
  const fl=$("#f-local");if(fl)fl.onclick=()=>{S.cmp.localOnly=!S.cmp.localOnly;render()};
  const fs=$("#f-sort");if(fs)fs.onclick=()=>{S.cmp.sort=S.cmp.sort==="unit"?"price":"unit";render()};
  const q=$("#q");if(q){const run=()=>{clearTimeout(S.qt);S.qt=setTimeout(()=>{if(S.ime)return;S.q=q.value;const pos=q.selectionStart;render();const n=$("#q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},250)};
    q.addEventListener("compositionstart",()=>{S.ime=true;clearTimeout(S.qt)});q.addEventListener("compositionend",()=>{S.ime=false;run()});
    q.oninput=e=>{if(e.isComposing||S.ime)return;run()};q.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){S.ime=false;run();q.blur()}}}
  const rate=$("#rate");if(rate)rate.querySelectorAll("button").forEach(b=>b.onclick=()=>{$("#rv-rating").value=b.dataset.v;rate.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.v<=+b.dataset.v))});
  const f=$("#rv-form");if(f)f.onsubmit=submitReview;
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{push({name:b.dataset.go});if(b.dataset.go==="admin")loadAdmin();if(b.dataset.go==="report")loadReport();if(b.dataset.go==="notice"){S.seenAt=Date.now();try{localStorage.setItem("bhp-seen",S.seenAt)}catch(e){}}});
  root.querySelectorAll("[data-book]").forEach(b=>{if(!b.closest("#cta"))b.onclick=()=>push({name:"book",id:b.dataset.book})});
  const bf=$("#bk-form");if(bf)bf.onsubmit=submitBooking;
  root.querySelectorAll("[data-afilter]").forEach(b=>b.onclick=()=>{S.adminFilter=b.dataset.afilter;render()});
  root.querySelectorAll("[data-setst]").forEach(b=>b.onclick=()=>setStatus(b.dataset.setst,b.dataset.st));
  root.querySelectorAll("[data-reload]").forEach(b=>b.onclick=()=>loadAdmin());root.querySelectorAll("[data-reload-report]").forEach(b=>b.onclick=()=>loadReport());root.querySelectorAll("[data-out]").forEach(a=>a.addEventListener("click",()=>trackOut(a.dataset.out,a.dataset.kind||"web")));
  root.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const w=b.parentElement;w.innerHTML='削除しますか? <button data-yes style="color:var(--accent);font-weight:700">削除する</button> <button data-no>やめる</button>';
    w.querySelector("[data-no]").onclick=()=>render();w.querySelector("[data-yes]").onclick=async()=>{try{await S.db.doc("reviews/"+b.dataset.del).delete();toast("削除しました")}catch(e){w.textContent="削除できませんでした"}}});
  const bn=$("#banner");if(bn){bn.onscroll=()=>{const i=Math.round(bn.scrollLeft/(bn.firstElementChild.offsetWidth+10));document.querySelectorAll("#dots i").forEach((d,k)=>d.classList.toggle("on",k===i))}}
  if(view().name==="clinic"){const c=S.clinics[view().id];if(c){$("#view").classList.add("has-cta");document.body.classList.add("cta-on");
    $("#cta").innerHTML='<div class="ctabar"><div class="wrap"><button class="btn sq" data-like="'+esc(view().id)+'" aria-pressed="'+isLiked(view().id)+'" aria-label="お気に入り">'+IC.heart+'</button>'+(BOOKING?'<a class="btn" href="'+esc(c.web)+'" target="_blank" rel="noopener" data-out="'+esc(view().id)+'" data-kind="web">公式サイト</a><button class="btn primary" data-book="'+esc(view().id)+'">'+IC.cal+'予約リクエスト</button>':'<a class="btn" href="'+esc(srcOf(view().id))+'" target="_blank" rel="noopener" data-out="'+esc(view().id)+'" data-kind="price">料金表</a><a class="btn primary" href="'+esc(c.web)+'" target="_blank" rel="noopener" data-out="'+esc(view().id)+'" data-kind="web">'+IC.cal+'公式サイトで予約</a>')+'</div></div>';
    $("#cta").querySelectorAll("[data-like]").forEach(b=>b.onclick=()=>toggleLike(b.dataset.like));$("#cta").querySelectorAll("[data-book]").forEach(b=>b.onclick=()=>push({name:"book",id:b.dataset.book}));$("#cta").querySelectorAll("[data-out]").forEach(a=>a.addEventListener("click",()=>trackOut(a.dataset.out,a.dataset.kind||"web")))}}
  names();
}
async function names(){const sp=[...document.querySelectorAll(".who[data-uid]")];if(!sp.length||!S.user)return;
  const ids=[...new Set(sp.map(s=>s.dataset.uid).filter(Boolean))];let ps={};try{ps=await S.user.profiles(ids)||{}}catch(e){}
  sp.forEach(s=>{if(s.previousSibling&&s.previousSibling.textContent)return;s.textContent=ps[s.dataset.uid]?.name||"匿名"})}
async function submitReview(e){
  e.preventDefault();const m=$("#rv-msg");const rating=+$("#rv-rating").value,text=$("#rv-text").value.trim();
  if(!rating){m.className="msg err";m.textContent="満足度の星を選んでください";return}
  if(text.length<15){m.className="msg err";m.textContent="口コミは15文字以上で書いてください";return}
  const paid=Math.round(+$("#rv-paid").value)||0;
  const d={clinicId:view().id,rating,text,group:$("#rv-group").value,paid:paid>0&&paid<5000000?paid:0,nickname:$("#rv-nick").value.trim(),author:S.uid||"",createdAt:Date.now()};
  const btn=e.target.querySelector("[type=submit]");btn.disabled=true;m.className="msg";m.textContent="投稿中…";
  try{await S.db.collection("reviews").add(d);$("#rv-text").value="";$("#rv-rating").value="0";toast("口コミを投稿しました");render()}
  catch(err){btn.disabled=false;m.className="msg err";m.textContent=err?.code==="invalid_argument"?"このページへの投稿権限がありません":"投稿できませんでした。もう一度お試しください";if(err?.code==="invalid_argument")S.canWrite=false}
}
function busy(){if($("#bk-form"))return true;const tx=$("#rv-text"),r=$("#rv-rating"),q=$("#q");if(q&&document.activeElement===q)return true;return!!(tx&&(tx.value.trim()||(r&&+r.value)||$("#rv-paid").value))}
function live(){if(busy())return;render()}

render();
(async()=>{
  let db=null,user=null;
  try{[db,user]=await Promise.all([window.claude?.use?window.claude.use("db"):null,window.claude?.use?window.claude.use("user"):null])}catch(e){}
  S.db=db;S.user=user;
  if(user){try{S.uid=await user.id()}catch(e){}try{if((await user.can("data.write"))===false)S.canWrite=false}catch(e){}
    try{S.me.name=(await user.name())||""}catch(e){}try{S.me.owner=!!(await user.isOwner())}catch(e){}try{S.me.edit=!!(await user.canEdit())||S.me.owner}catch(e){}}
  if(!db){S.loaded=true;render();return}
  const got=new Set();const arrive=k=>{if(S.loaded){live();return}got.add(k);if(got.has("clinics")&&got.has("prices")){S.loaded=true;render()}};
  db.collection("clinics").onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());S.clinics=o;arrive("clinics")},()=>{S.loaded=true;render()});
  db.collection("prices").onSnapshot(s=>{S.prices=s.docs.map(d=>({id:d.id,...d.data()}));arrive("prices")},()=>{S.loaded=true;render()});
  db.collection("updates").orderBy("date","desc").limit(30).onSnapshot(s=>{S.updates=s.docs.map(d=>d.data());arrive("updates")},()=>{});
  if(S.uid)db.collection("bookings/"+S.uid+"/items").onSnapshot(s=>{S.bookings=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(S.loaded)live()},()=>{});
  db.collection("reviews").onSnapshot(s=>{S.reviews=s.docs.map(d=>({id:d.id,...d.data()}));arrive("reviews")},()=>{});
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},8000);
})();
